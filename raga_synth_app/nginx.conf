server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # Serve the app at the subpath /carnatic/
    location /carnatic/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    # Redirect /carnatic (no trailing slash) to /carnatic/ relatively to prevent port loss
    location = /carnatic {
        return 301 /carnatic/;
    }

    # Redirect root / to /carnatic/ so users visiting root get to the app automatically
    location / {
        return 301 /carnatic/;
    }
}
